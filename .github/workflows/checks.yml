name: Source checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy
      - run: python satc.py model
      - run: python -m compileall -q satc.py runtime experiments GXRStream/ubuntu GXRStream/stream_encoded.py
      - run: python -m unittest discover -s tests -v
      - run: python runtime/encoder.py --self-test
      - run: python experiments/research/final_quality_matrix.py --self-test
